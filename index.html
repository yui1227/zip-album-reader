<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP 圖片閱讀器</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1f2937">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- zip.js 採隨機存取：只讀中央目錄，翻到哪一頁才解那一段，
         記憶體用量與壓縮檔大小無關（JSZip 會把整個檔案讀進記憶體） -->
    <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.8.34/dist/zip.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white">

    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md z-20 relative">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                ZIP 閱讀器 Pro
            </h1>
            <div class="flex items-center gap-3">
                <button id="toggle-mode-btn"
                    class="hidden text-sm bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded transition-colors flex items-center gap-2"></button>
                <button id="close-reader"
                    class="hidden text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition-colors">返回上傳</button>
            </div>
        </div>
    </header>

    <main class="relative h-[calc(100vh-69px)] w-full overflow-hidden">

        <div id="upload-view"
            class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-gray-900 transition-opacity duration-300 z-10">
            <div id="drop-zone"
                class="w-full max-w-2xl border-2 border-dashed border-gray-600 rounded-2xl p-12 text-center bg-gray-800/50 hover:bg-gray-800 hover:border-blue-500 transition-all cursor-pointer group">
                <input type="file" id="file-input" accept=".zip" class="hidden" />
                <div class="flex flex-col items-center gap-4 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-16 w-16 text-gray-400 group-hover:text-blue-400 transition-colors" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                    </svg>
                    <div>
                        <p class="text-xl font-medium text-gray-200">點擊選擇 ZIP 檔案，或將檔案拖曳至此</p>
                    </div>
                </div>
            </div>
            <footer class="mt-6 text-xs text-gray-500 text-center">
                <span id="version-info">版本載入中...</span>
            </footer>
        </div>

        <div id="gallery-container" class="absolute inset-0 hidden bg-gray-950 z-0">
            <div id="gallery-view"
                class="h-full w-full overflow-y-auto p-4 content-start gap-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
            </div>
        </div>

        <div id="reader-view" class="absolute inset-0 hidden flex-col bg-gray-950 z-0">
            <div class="flex-1 overflow-auto flex justify-center items-center p-4 no-scrollbar relative"
                id="image-container">
                <div id="img-loading"
                    class="hidden absolute inset-0 flex items-center justify-center bg-gray-950/60 z-10 backdrop-blur-sm transition-opacity">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
                </div>
                <img id="viewer-image" src="" alt="目前圖片"
                    class="max-w-full max-h-full object-contain shadow-2xl select-none cursor-pointer"
                    title="點擊左側上一張，右側下一張" />
            </div>

            <div id="scroll-view"
                class="hidden flex-1 overflow-y-auto p-4 flex-col items-center gap-4 no-scrollbar"></div>

            <div
                class="bg-gray-900 border-t border-gray-800 p-3 flex flex-wrap justify-between items-center gap-4 shrink-0">
                <div class="flex items-center gap-3">
                    <button id="reader-style-btn"
                        class="hidden text-sm bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded transition-colors flex items-center gap-1"
                        title="切換翻頁/捲動模式">
                        <span id="reader-style-icon">📄</span><span class="hidden md:inline"
                            id="reader-style-label">翻頁</span>
                    </button>
                    <span id="page-info" class="text-sm text-gray-400 font-mono w-16 md:w-20">0 / 0</span>
                    <div class="flex items-center border-l border-gray-700 pl-3 gap-1">
                        <button id="new-tab-btn"
                            class="p-2 text-gray-400 hover:text-blue-400 hover:bg-gray-800 rounded transition-colors"
                            title="在新分頁開啟"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg></button>
                        <button id="download-btn"
                            class="p-2 text-gray-400 hover:text-green-400 hover:bg-gray-800 rounded transition-colors"
                            title="下載此圖片"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg></button>
                    </div>
                </div>
                <div
                    class="flex items-center gap-2 mt-2 md:mt-0 w-full md:w-auto justify-center md:justify-end flex-wrap">
                    <button id="first-btn"
                        class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        title="回到第一頁"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z"
                                clip-rule="evenodd" />
                        </svg></button>
                    <button id="prev-btn"
                        class="bg-gray-800 hover:bg-gray-700 text-white p-2 md:px-4 md:py-2 rounded flex items-center gap-1 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"><svg
                            xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                                clip-rule="evenodd" />
                        </svg><span class="hidden md:inline">前一頁</span></button>
                    <select id="page-select"
                        class="bg-gray-800 border border-gray-700 text-gray-200 text-sm rounded focus:ring-blue-500 focus:border-blue-500 block p-2 outline-none w-[100px] md:w-[130px] truncate text-center cursor-pointer"></select>
                    <button id="next-btn"
                        class="bg-blue-600 hover:bg-blue-500 text-white p-2 md:px-4 md:py-2 rounded flex items-center gap-1 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"><span
                            class="hidden md:inline">下一頁</span><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                            viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                clip-rule="evenodd" />
                        </svg></button>
                    <button id="last-btn"
                        class="bg-gray-800 hover:bg-gray-700 text-white p-2 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        title="最後一頁"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10.293 15.707a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z"
                                clip-rule="evenodd" />
                            <path fill-rule="evenodd"
                                d="M4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z"
                                clip-rule="evenodd" />
                        </svg></button>
                </div>
            </div>
        </div>
    </main>

    <div id="global-loading"
        class="fixed inset-0 bg-gray-900/90 hidden z-50 flex-col items-center justify-center backdrop-blur-sm">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-lg font-medium animate-pulse">正在解析 ZIP 檔案...</p>
    </div>

    <div id="toast"
        class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-6 py-3 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50">
        <span id="toast-msg">訊息</span>
    </div>

    <script>
        const DOM = {
            uploadView: document.getElementById('upload-view'),
            galleryContainer: document.getElementById('gallery-container'),
            galleryView: document.getElementById('gallery-view'),
            readerView: document.getElementById('reader-view'),
            fileInput: document.getElementById('file-input'),
            dropZone: document.getElementById('drop-zone'),
            viewerImage: document.getElementById('viewer-image'),
            firstBtn: document.getElementById('first-btn'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            lastBtn: document.getElementById('last-btn'),
            pageSelect: document.getElementById('page-select'),
            pageInfo: document.getElementById('page-info'),
            globalLoading: document.getElementById('global-loading'),
            imgLoading: document.getElementById('img-loading'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toast-msg'),
            closeReaderBtn: document.getElementById('close-reader'),
            toggleModeBtn: document.getElementById('toggle-mode-btn'),
            imageContainer: document.getElementById('image-container'),
            newTabBtn: document.getElementById('new-tab-btn'),
            downloadBtn: document.getElementById('download-btn'),
            scrollView: document.getElementById('scroll-view'),
            readerStyleBtn: document.getElementById('reader-style-btn'),
            readerStyleIcon: document.getElementById('reader-style-icon'),
            readerStyleLabel: document.getElementById('reader-style-label')
        };

        let imageFiles = [];
        let currentIndex = 0;
        let isLoadingImage = false;
        let currentMode = 'upload';
        let readerStyle = 'paged'; // 'paged'（翻頁）或 'scroll'（無限捲動）

        // ZipReader 必須在整個閱讀過程中保持開啟：它只握著檔案的 handle，
        // 每次要圖片時才去讀對應的那一段，所以不能像 JSZip 那樣讀完就丟
        let zipReader = null;

        const MIME_BY_EXT = {
            png: 'image/png', gif: 'image/gif', webp: 'image/webp',
            avif: 'image/avif', jpg: 'image/jpeg', jpeg: 'image/jpeg'
        };

        function mimeTypeOf(filename) {
            return MIME_BY_EXT[filename.split('.').pop().toLowerCase()] || 'image/jpeg';
        }

        // 取出第 index 張圖片的 Blob。只有這一張會進到記憶體
        function readImageBlob(index) {
            const entry = imageFiles[index];
            return entry.getData(new zip.BlobWriter(mimeTypeOf(entry.filename)));
        }

        function closeZipReader() {
            if (!zipReader) return;
            const reader = zipReader;
            zipReader = null;
            // 進行中的讀取會被中斷而 reject，各呼叫端都有自己的 catch
            reader.close().catch(() => { });
        }

        // 記憶體管理模組
        let galleryUrls = new Map(); // 相簿模式的觀察器快取
        let galleryObserver = null;
        let preloadCache = new Map(); // 閱讀模式（翻頁）的預載快取 (存放 index -> ObjectURL)
        let scrollUrls = new Map(); // 閱讀模式（捲動）的快取
        let scrollObserver = null;

        // ==========================================
        // 通用的懶載入工具：延遲觸發 + 可取消 + 併發限制
        // 相簿模式跟捲動模式共用同一套邏輯，避免快速捲動時大量解壓縮卡住主執行緒
        // ==========================================
        function createLazyImageLoader(urlMap, options = {}) {
            const { maxConcurrent = 3, delay = 150, maxRetries = 3 } = options;

            // 唯一的真相來源是「這個 index 現在是不是在視野內」，而不是事件發生的順序。
            // 只靠 IntersectionObserver 的進出事件會出事：快速捲動時瀏覽器會合併狀態、
            // 事件也可能顛倒送達，一旦某次載入被取消，那個項目不會再收到第二次
            // onEnter（因為它從頭到尾都還在視野裡），圖片就永遠停在轉圈狀態。
            const visible = new Map(); // index -> onDone
            const pendingTimers = new Map();
            const inFlight = new Set();
            const failures = new Map();
            let activeDecodes = 0;
            const decodeQueue = [];

            function runNext() {
                while (activeDecodes < maxConcurrent && decodeQueue.length > 0) {
                    const job = decodeQueue.shift();
                    activeDecodes++;
                    job.run().finally(() => {
                        activeDecodes--;
                        inFlight.delete(job.index);
                        runNext();
                        reconcile(); // 補上剛才因為時序而漏掉的項目
                    });
                }
            }

            // 掃一遍目前在視野內、卻既沒有圖也沒有排程的項目，把它們補回佇列
            function reconcile() {
                for (const [index, onDone] of visible) {
                    if (urlMap.has(index) || inFlight.has(index) || pendingTimers.has(index)) continue;
                    if ((failures.get(index) || 0) >= maxRetries) continue; // 壞掉的圖不要無限重試
                    enqueue(index, onDone);
                }
            }

            function enqueue(index, onDone) {
                inFlight.add(index);
                decodeQueue.push({
                    index,
                    run: async () => {
                        if (!visible.has(index)) return; // 排隊期間就被捲走了
                        try {
                            const blobData = await readImageBlob(index);
                            const done = visible.get(index); // 解完後再確認一次，並取用最新的 callback
                            if (!done) return;
                            const url = URL.createObjectURL(blobData);
                            urlMap.set(index, url);
                            failures.delete(index);
                            done(url);
                        } catch (e) {
                            failures.set(index, (failures.get(index) || 0) + 1);
                            console.warn('圖片解壓縮失敗', index, e);
                        }
                    }
                });
                runNext();
            }

            return {
                onEnter(index, onDone) {
                    visible.set(index, onDone);
                    if (urlMap.has(index)) { onDone(urlMap.get(index)); return; }
                    if (pendingTimers.has(index) || inFlight.has(index)) return; // 已排程，不重複
                    const timer = setTimeout(() => {
                        pendingTimers.delete(index); // 觸發後務必清掉，否則會累積成殭屍項目
                        if (visible.has(index)) enqueue(index, visible.get(index));
                    }, delay);
                    pendingTimers.set(index, timer);
                },
                onLeave(index, onRevoke) {
                    visible.delete(index);
                    failures.delete(index); // 下次捲回來時給它重新開始的機會
                    if (pendingTimers.has(index)) {
                        clearTimeout(pendingTimers.get(index));
                        pendingTimers.delete(index);
                    }
                    if (urlMap.has(index)) {
                        const url = urlMap.get(index);
                        urlMap.delete(index);
                        URL.revokeObjectURL(url);
                        onRevoke();
                    }
                }
            };
        }

        function showToast(message, duration = 3000) {
            DOM.toastMsg.textContent = message;
            DOM.toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => DOM.toast.classList.add('opacity-0', 'translate-y-4'), duration);
        }

        // ==========================================
        // 【核心】預載機制與記憶體控管
        // ==========================================
        async function managePreloadCache(targetIndex) {
            // 定義我們要保留在記憶體的安全範圍 (前一頁、當前頁、後一頁)
            const keepIndices = new Set([targetIndex - 1, targetIndex, targetIndex + 1]);

            // 1. 清理不在範圍內的舊快取 (防止記憶體暴增)
            for (let [index, url] of preloadCache.entries()) {
                if (!keepIndices.has(index)) {
                    URL.revokeObjectURL(url);
                    preloadCache.delete(index);
                }
            }

            // 2. 偷偷在背景預載「下一頁」
            const nextIndex = targetIndex + 1;
            if (nextIndex < imageFiles.length && !preloadCache.has(nextIndex)) {
                try {
                    const blobData = await readImageBlob(nextIndex);
                    preloadCache.set(nextIndex, URL.createObjectURL(blobData));
                } catch (e) { console.warn("預載下一張失敗"); }
            }

            // 3. 偷偷在背景預載「上一頁」
            const prevIndex = targetIndex - 1;
            if (prevIndex >= 0 && !preloadCache.has(prevIndex)) {
                try {
                    const blobData = await readImageBlob(prevIndex);
                    preloadCache.set(prevIndex, URL.createObjectURL(blobData));
                } catch (e) { console.warn("預載上一張失敗"); }
            }
        }

        // 模式切換邏輯
        function switchMode(targetMode) {
            currentMode = targetMode;
            DOM.uploadView.classList.add('hidden');
            DOM.galleryContainer.classList.add('hidden');
            DOM.readerView.classList.add('hidden');
            DOM.readerView.classList.remove('flex');

            if (targetMode === 'upload') {
                DOM.uploadView.classList.remove('hidden');
                DOM.closeReaderBtn.classList.add('hidden');
                DOM.toggleModeBtn.classList.add('hidden');
                DOM.readerStyleBtn.classList.add('hidden');
                clearAllMemory();
            }
            else if (targetMode === 'gallery') {
                DOM.galleryContainer.classList.remove('hidden');
                DOM.closeReaderBtn.classList.remove('hidden');
                DOM.toggleModeBtn.classList.remove('hidden');
                DOM.readerStyleBtn.classList.add('hidden');
                DOM.toggleModeBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>切換閱讀模式`;

                // 離開閱讀模式時，釋放預載快取（翻頁與捲動兩種都要清）
                preloadCache.forEach(url => URL.revokeObjectURL(url));
                preloadCache.clear();
                DOM.viewerImage.src = "";
                teardownScrollView();
            }
            else if (targetMode === 'reader') {
                DOM.readerView.classList.remove('hidden');
                DOM.readerView.classList.add('flex');
                DOM.closeReaderBtn.classList.remove('hidden');
                DOM.toggleModeBtn.classList.remove('hidden');
                DOM.readerStyleBtn.classList.remove('hidden');
                DOM.toggleModeBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>切換相簿模式`;
            }
        }

        // ==========================================
        // 【新增】瀏覽器 / 手機「返回」鍵整合
        // 把三個畫面當成三層歷史：選擇 ZIP → 相簿 → 閱讀頁
        // 按返回就往回退一層，而不是直接離開網站
        // ==========================================
        const VIEW_STACK = ['upload', 'gallery', 'reader'];

        function historyState(view, index) {
            return { view, index: typeof index === 'number' ? index : currentIndex };
        }

        // 只負責切畫面，不碰 history（goToView 與 popstate 共用這一份）
        function applyView(view, index) {
            if (view === 'reader') {
                enterReaderAt(typeof index === 'number' ? index : currentIndex);
                return;
            }
            switchMode(view);
            if (view === 'gallery' && imageFiles.length > 0) {
                const targetThumb = DOM.galleryView.querySelector(`[data-index="${currentIndex}"]`);
                if (targetThumb) targetThumb.scrollIntoView({ behavior: 'auto', block: 'center' });
            }
        }

        // 前往某個畫面，同時把這一步記進瀏覽器歷史
        function goToView(view, index) {
            const from = VIEW_STACK.indexOf(currentMode);
            const to = VIEW_STACK.indexOf(view);

            if (to > from) {
                for (let depth = from + 1; depth <= to; depth++) {
                    history.pushState(historyState(VIEW_STACK[depth], index), '');
                }
                applyView(view, index);
            } else if (to < from) {
                // 往回退一律交給 history，讓畫面上的按鈕跟返回鍵走同一條路徑
                history.go(to - from);
            } else {
                history.replaceState(historyState(view, index), '');
                applyView(view, index);
            }
        }

        window.addEventListener('popstate', (event) => {
            const view = (event.state && event.state.view) || 'upload';
            // 重新整理後歷史還在、但圖片已經被清掉了，就一律退回上傳畫面。
            // 這裡一定要把「目前這筆歷史」也改寫成 upload，否則畫面與歷史位置會脫鉤，
            // 之後 goToView 算出來的層數差就會錯（例如從閱讀頁按返回上傳只退了一層）
            if (view !== 'upload' && imageFiles.length === 0) {
                switchMode('upload');
                history.replaceState(historyState('upload', 0), '');
                return;
            }
            applyView(view, event.state && event.state.index);
        });

        // 換頁時把頁碼寫回目前這筆歷史，之後返回再前進可以回到同一頁
        function syncHistoryIndex() {
            if (currentMode !== 'reader') return;
            if (!history.state || history.state.view !== 'reader') return;
            history.replaceState(historyState('reader'), '');
        }

        // 起始狀態：不管上次留下什麼，載入時一律從選擇 ZIP 的畫面算起
        history.replaceState(historyState('upload', 0), '');

        DOM.toggleModeBtn.addEventListener('click', () => {
            if (currentMode === 'gallery') goToView('reader', currentIndex);
            else goToView('gallery');
        });

        function initGallery() {
            DOM.galleryView.innerHTML = '';
            if (galleryObserver) galleryObserver.disconnect();

            const loader = createLazyImageLoader(galleryUrls, { maxConcurrent: 3, delay: 150 });

            galleryObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const index = parseInt(entry.target.dataset.index);
                    const img = entry.target.querySelector('img');
                    const spinner = entry.target.querySelector('.spinner');

                    if (entry.isIntersecting) {
                        loader.onEnter(index, (url) => {
                            img.src = url;
                            img.onload = () => { spinner.classList.add('hidden'); img.classList.remove('opacity-0'); };
                        });
                    } else {
                        loader.onLeave(index, () => {
                            img.src = '';
                            img.classList.add('opacity-0');
                            spinner.classList.remove('hidden');
                        });
                    }
                });
            }, { root: DOM.galleryView, rootMargin: '300px', threshold: 0 });

            imageFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'relative w-full pb-[100%] bg-gray-800 rounded-lg overflow-hidden cursor-pointer hover:ring-4 hover:ring-blue-500 transition-all group shadow-sm';
                item.dataset.index = index;
                const fileName = file.filename.split('/').pop();

                item.innerHTML = `
                    <div class="absolute inset-0">
                        <div class="spinner absolute inset-0 flex items-center justify-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-600"></div></div>
                        <img class="opacity-0 absolute inset-0 w-full h-full object-cover transition-opacity duration-500" />
                        <div class="absolute top-1 left-1 bg-black/70 text-white text-xs px-2 py-1 rounded shadow-lg backdrop-blur-sm font-mono z-10 pointer-events-none">${index + 1}</div>
                        <div class="caption absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent pt-8 pb-2 px-2 text-white text-xs truncate opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none"></div>
                    </div>
                `;
                // 檔名是 ZIP 裡的不可信內容，用 textContent 填入，不要串進 innerHTML
                item.querySelector('.caption').textContent = fileName;
                item.addEventListener('click', () => { goToView('reader', index); });
                DOM.galleryView.appendChild(item);
                galleryObserver.observe(item);
            });
        }

        // ==========================================
        // 【新增】無限捲動閱讀模式（原始解析度，畫質優先）
        // ==========================================
        // ==========================================
        // 版面穩定（捲動模式）
        // 項目在圖片載入前只有 min-h-[50vh]，圖片一進來就撐開、把下方內容整個往下推，
        // 使用者正在看的那一頁會被擠出視野，看起來就像「圖片沒載入」。
        // 因此一量到長寬比就先把高度佔好；同一本漫畫頁面尺寸多半一致，
        // 所以第一張量到的比例也先套用到其他還沒載入過的項目。
        // ==========================================
        let pageRatios = new Map(); // index -> 寬/高
        let defaultPageRatio = null;

        function applyItemRatio(item, ratio) {
            if (!ratio) return;
            item.style.aspectRatio = String(ratio);
            item.style.minHeight = '0';
        }

        function rememberPageRatio(index, img, item) {
            if (!img.naturalWidth || !img.naturalHeight) return;
            const ratio = img.naturalWidth / img.naturalHeight;
            pageRatios.set(index, ratio);
            applyItemRatio(item, ratio);
            if (defaultPageRatio === null) {
                defaultPageRatio = ratio;
                for (const other of DOM.scrollView.children) {
                    if (!pageRatios.has(Number(other.dataset.index))) applyItemRatio(other, ratio);
                }
            }
        }

        function buildScrollView() {
            DOM.scrollView.innerHTML = '';
            DOM.scrollView.scrollTop = 0;
            if (scrollObserver) scrollObserver.disconnect();

            const loader = createLazyImageLoader(scrollUrls, { maxConcurrent: 2, delay: 100 });

            scrollObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const index = parseInt(entry.target.dataset.index);
                    const img = entry.target.querySelector('img');
                    const spinner = entry.target.querySelector('.spinner');

                    if (entry.isIntersecting) {
                        loader.onEnter(index, (url) => {
                            img.src = url;
                            img.onload = () => {
                                spinner.classList.add('hidden');
                                img.classList.remove('opacity-0');
                                rememberPageRatio(index, img, entry.target);
                            };
                        });
                        // 用來判斷目前「主要看的是哪一頁」，同步頁碼顯示/下拉選單
                        if (entry.intersectionRatio >= 0.5) {
                            currentIndex = index;
                            updateControlsState();
                        }
                    } else {
                        loader.onLeave(index, () => {
                            img.src = '';
                            img.classList.add('opacity-0');
                            spinner.classList.remove('hidden');
                        });
                    }
                });
            }, { root: DOM.scrollView, rootMargin: '1500px 0px 1500px 0px', threshold: [0, 0.5] });

            imageFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'relative w-full max-w-4xl min-h-[50vh] flex items-center justify-center shrink-0';
                item.dataset.index = index;
                item.innerHTML = `
                    <div class="spinner absolute inset-0 flex items-center justify-center"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-gray-600"></div></div>
                    <img class="opacity-0 max-w-full max-h-full transition-opacity duration-300 select-none" alt="第 ${index + 1} 頁" />
                `;
                // 已知比例就先把高度佔好，卸載後也保留，捲回來時不會再位移一次
                applyItemRatio(item, pageRatios.get(index) || defaultPageRatio);
                DOM.scrollView.appendChild(item);
                scrollObserver.observe(item);
            });
        }

        function teardownScrollView() {
            if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
            scrollUrls.forEach(url => URL.revokeObjectURL(url));
            scrollUrls.clear();
            DOM.scrollView.innerHTML = '';
        }

        // 進入閱讀模式的統一入口：依照目前的 readerStyle 決定顯示翻頁還是捲動
        function enterReaderAt(index) {
            currentIndex = index;
            switchMode('reader');
            if (readerStyle === 'scroll') {
                DOM.imageContainer.classList.add('hidden');
                DOM.scrollView.classList.remove('hidden');
                buildScrollView();
                requestAnimationFrame(() => {
                    const target = DOM.scrollView.children[currentIndex];
                    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
                });
            } else {
                DOM.scrollView.classList.add('hidden');
                DOM.imageContainer.classList.remove('hidden');
                goToPage(index);
            }
        }

        // 統一的換頁邏輯：翻頁模式直接換圖，捲動模式則捲到對應位置
        function navigateTo(index) {
            if (index < 0 || index >= imageFiles.length) return;
            if (readerStyle === 'scroll') {
                const target = DOM.scrollView.children[index];
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                currentIndex = index;
                updateControlsState();
                syncHistoryIndex();
            } else {
                goToPage(index);
            }
        }

        function clearAllMemory() {
            preloadCache.forEach(url => URL.revokeObjectURL(url));
            preloadCache.clear();
            DOM.viewerImage.src = "";

            galleryUrls.forEach(url => URL.revokeObjectURL(url));
            galleryUrls.clear();
            if (galleryObserver) galleryObserver.disconnect();

            teardownScrollView();
            closeZipReader();
            pageRatios.clear();       // 換一本書就要重新學頁面比例
            defaultPageRatio = null;

            imageFiles = [];
            DOM.fileInput.value = "";
        }

        DOM.closeReaderBtn.addEventListener('click', () => goToView('upload'));

        async function handleFileProcess(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.zip')) { showToast("請上傳 .zip 格式的檔案！"); return; }

            DOM.globalLoading.classList.remove('hidden');
            DOM.globalLoading.classList.add('flex');

            try {
                closeZipReader(); // 換檔案時先收掉上一個，避免 worker 殘留
                currentIndex = 0; // 重設頁碼，避免沿用上一個檔案的位置

                // 只讀中央目錄，不碰壓縮內容，所以多大的檔案都是一瞬間
                zipReader = new zip.ZipReader(new zip.BlobReader(file));
                const entries = await zipReader.getEntries();

                imageFiles = entries.filter(entry => {
                    if (entry.directory) return false;
                    const path = entry.filename;
                    if (path.includes('__MACOSX') || path.split('/').pop().startsWith('._')) return false;
                    return /\.(jpe?g|png|gif|webp|avif)$/i.test(path);
                });

                if (imageFiles.length === 0) { showToast("找不到任何圖片！"); closeZipReader(); return; }

                imageFiles.sort((a, b) => a.filename.localeCompare(b.filename, undefined, { numeric: true, sensitivity: 'base' }));

                DOM.pageSelect.innerHTML = '';
                imageFiles.forEach((entry, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `第 ${index + 1} 頁 - ${entry.filename.split('/').pop()}`;
                    DOM.pageSelect.appendChild(option);
                });

                initGallery();
                goToView('gallery');
                DOM.galleryView.scrollTop = 0; // 容器顯示出來之後才重設，隱藏狀態下設定會被瀏覽器忽略

            } catch (error) {
                closeZipReader();
                imageFiles = [];
                // 記憶體不足跟檔案損毀是完全不同的問題，全部報成「已損毀」會讓人查不出原因
                console.error('ZIP 解析失敗:', error);
                const detail = (error && (error.message || error.name)) || '';
                const isMemory = error instanceof RangeError || /allocation|out of memory|buffer/i.test(detail);
                // 只取第一句放進 toast，完整訊息留在 console 供排查
                const short = detail.split(/[:.\n]/)[0].trim().slice(0, 60);
                showToast(isMemory
                    ? `檔案太大（${(file.size / 1048576).toFixed(0)} MB），瀏覽器記憶體不足`
                    : `讀取失敗：${short || '檔案可能已損毀'}`, 5000);
            }
            finally { DOM.globalLoading.classList.add('hidden'); DOM.globalLoading.classList.remove('flex'); }
        }

        // ==========================================
        // 【修改】整合預載機制的換頁邏輯
        // ==========================================
        async function goToPage(index) {
            if (index < 0 || index >= imageFiles.length) return;
            if (isLoadingImage) return;

            isLoadingImage = true;
            currentIndex = index;
            updateControlsState();
            syncHistoryIndex();

            let targetUrl = "";

            // 1. 檢查是否已經預載過？
            if (preloadCache.has(index)) {
                targetUrl = preloadCache.get(index); // 秒速取用！
            } else {
                // 如果沒預載到 (例如使用者突然亂跳頁)，就當場載入並顯示動畫
                DOM.imgLoading.classList.remove('hidden');
                try {
                    const blobData = await readImageBlob(index);
                    targetUrl = URL.createObjectURL(blobData);
                    preloadCache.set(index, targetUrl);
                } catch (e) {
                    showToast("載入圖片失敗");
                    isLoadingImage = false;
                    DOM.imgLoading.classList.add('hidden');
                    return;
                }
            }

            // 2. 顯示圖片
            const tempImg = new Image();
            tempImg.onload = () => {
                DOM.viewerImage.src = targetUrl;
                DOM.imgLoading.classList.add('hidden');
                DOM.imageContainer.scrollTop = 0;
                isLoadingImage = false;

                // 3. 圖片顯示完成後，觸發預載下一張，並清理不必要的舊記憶體
                managePreloadCache(index);
            };
            tempImg.onerror = () => { showToast("圖片解碼發生錯誤。"); isLoadingImage = false; DOM.imgLoading.classList.add('hidden'); };
            tempImg.src = targetUrl;
        }

        function updateControlsState() {
            DOM.pageInfo.textContent = `${currentIndex + 1} / ${imageFiles.length}`;
            DOM.pageSelect.value = currentIndex;
            const isFirst = currentIndex === 0, isLast = currentIndex === imageFiles.length - 1;
            DOM.firstBtn.disabled = DOM.prevBtn.disabled = isFirst;
            DOM.nextBtn.disabled = DOM.lastBtn.disabled = isLast;
        }

        // --- 事件綁定 ---
        DOM.dropZone.addEventListener('click', () => DOM.fileInput.click());
        DOM.fileInput.addEventListener('change', (e) => handleFileProcess(e.target.files[0]));
        DOM.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); DOM.dropZone.classList.add('border-blue-500', 'bg-gray-800'); });
        DOM.dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); DOM.dropZone.classList.remove('border-blue-500', 'bg-gray-800'); });
        DOM.dropZone.addEventListener('drop', (e) => { e.preventDefault(); DOM.dropZone.classList.remove('border-blue-500', 'bg-gray-800'); handleFileProcess(e.dataTransfer.files[0]); });

        DOM.viewerImage.addEventListener('click', (e) => {
            if (e.offsetX < e.target.clientWidth / 2) goToPage(currentIndex - 1);
            else goToPage(currentIndex + 1);
        });

        DOM.newTabBtn.addEventListener('click', async () => {
            if (imageFiles.length === 0) return;
            const newTab = window.open('about:blank', '_blank');
            if (!newTab) { showToast("請允許瀏覽器開啟彈出視窗！"); return; }
            try {
                const entry = imageFiles[currentIndex];
                // 用 data URI 而非 blob URL：新分頁不依賴本頁，關掉這裡也不會失效
                const dataUrl = await entry.getData(new zip.Data64URIWriter(mimeTypeOf(entry.filename)));
                const title = entry.filename.split('/').pop();

                // 檔名來自 ZIP 內部、屬於不可信輸入，因此用 DOM API 逐一組裝，
                // 不用 document.write 串字串，避免惡意檔名注入 HTML
                const doc = newTab.document;
                const meta = doc.createElement('meta');
                meta.setAttribute('charset', 'UTF-8');
                doc.head.appendChild(meta);

                const style = doc.createElement('style');
                style.textContent = 'body{margin:0;background-color:#0e1111;display:flex;justify-content:center;align-items:center;min-height:100vh;}img{max-width:100%;max-height:100vh;object-fit:contain;}';
                doc.head.appendChild(style);

                doc.title = title;

                const img = doc.createElement('img');
                img.src = dataUrl;
                img.alt = title;
                doc.body.appendChild(img);
            } catch (error) { newTab.close(); showToast("無法開啟圖片"); }
        });

        let isDownloading = false;
        DOM.downloadBtn.addEventListener('click', async () => {
            if (imageFiles.length === 0 || isDownloading) return;

            const cache = readerStyle === 'scroll' ? scrollUrls : preloadCache;
            let url = cache.get(currentIndex);
            // 快取沒命中（例如圖片還在載入中）就當場解壓縮，用完再釋放，不要靜默失效
            let isTempUrl = false;

            if (!url) {
                isDownloading = true;
                try {
                    const blobData = await readImageBlob(currentIndex);
                    url = URL.createObjectURL(blobData);
                    isTempUrl = true;
                } catch (e) {
                    showToast("下載失敗，無法讀取這張圖片。");
                    return;
                } finally {
                    isDownloading = false;
                }
            }

            const a = document.createElement('a');
            a.href = url;
            a.download = imageFiles[currentIndex].filename.split('/').pop();
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            if (isTempUrl) setTimeout(() => URL.revokeObjectURL(url), 60000);
        });

        DOM.readerStyleBtn.addEventListener('click', () => {
            if (readerStyle === 'paged') {
                readerStyle = 'scroll';
                DOM.readerStyleIcon.textContent = '📜';
                DOM.readerStyleLabel.textContent = '捲動';
                DOM.imageContainer.classList.add('hidden');
                DOM.scrollView.classList.remove('hidden');
                buildScrollView();
                requestAnimationFrame(() => {
                    const target = DOM.scrollView.children[currentIndex];
                    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
                });
            } else {
                readerStyle = 'paged';
                DOM.readerStyleIcon.textContent = '📄';
                DOM.readerStyleLabel.textContent = '翻頁';
                teardownScrollView();
                DOM.scrollView.classList.add('hidden');
                DOM.imageContainer.classList.remove('hidden');
                goToPage(currentIndex);
            }
        });

        DOM.firstBtn.addEventListener('click', () => navigateTo(0));
        DOM.prevBtn.addEventListener('click', () => navigateTo(currentIndex - 1));
        DOM.nextBtn.addEventListener('click', () => navigateTo(currentIndex + 1));
        DOM.lastBtn.addEventListener('click', () => navigateTo(imageFiles.length - 1));
        DOM.pageSelect.addEventListener('change', (e) => navigateTo(parseInt(e.target.value, 10)));

        document.addEventListener('keydown', (e) => {
            if (currentMode === 'reader') {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigateTo(currentIndex + 1);
                else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigateTo(currentIndex - 1);
            }
        });

        // ==========================================
        // 版本資訊：讀取 GitHub 上 main 分支的最新 commit hash
        // ==========================================
        (async function loadVersionInfo() {
            const el = document.getElementById('version-info');
            if (!el) return;
            try {
                const cached = sessionStorage.getItem('zip-reader-version');
                if (cached) { el.textContent = cached; return; }
                const res = await fetch('https://api.github.com/repos/yui1227/zip-album-reader/commits/main');
                if (!res.ok) throw new Error('fetch failed');
                const data = await res.json();
                const shortSha = data.sha.substring(0, 7);
                const text = `版本 ${shortSha}`;
                el.textContent = text;
                if (data.commit && data.commit.message) {
                    el.title = data.commit.message.split('\n')[0];
                }
                sessionStorage.setItem('zip-reader-version', text);
            } catch (e) {
                el.textContent = '版本資訊無法取得';
            }
        })();
    </script>
    <script>
        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA 準備就緒！範圍:', reg.scope))
                    .catch(err => console.log('PWA 註冊失敗:', err));
            });
        }
    </script>
</body>

</html>
